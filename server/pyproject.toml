# StarDissect 后端:单进程 FastAPI 应用(ADR-0001)
[project]
name = "stardissect"
version = "1.0.0"
description = "自托管 GitHub Star 深度解析工具"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "markdown-it-py[plugins,linkify]>=3.0",
    "pygments>=2.17",
    "jieba>=0.42",
    "gidgethub>=5.3",
    "apscheduler>=3.10,<4",
    "feedgen>=1.0",
    "pydantic-ai-slim[openai,anthropic]>=0.4",
    "nh3>=0.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

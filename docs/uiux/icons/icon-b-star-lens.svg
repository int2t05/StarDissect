<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="星剖 · 星与透镜图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#123f52"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c15c"/>
      <stop offset="1" stop-color="#e08e33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="starB" d="M256 86 L291.3 187.5 L398.7 189.6 L313.1 254.5 L344.2 357.4 L256 296 L167.8 357.4 L198.9 254.5 L113.3 189.6 L220.7 187.5 Z"/>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <!-- 透镜镜柄 -->
  <path d="M336 336 L428 428" stroke="#cbe6f2" stroke-width="40" stroke-linecap="round"/>
  <!-- 镜片：内层深色 + 星，外层亮圈 -->
  <circle cx="240" cy="240" r="152" fill="#0a2e3c" fill-opacity="0.85"/>
  <use href="#starB" transform="translate(240 224) scale(0.62) translate(-256 -236)" fill="url(#amber)"/>
  <circle cx="240" cy="240" r="152" fill="none" stroke="#cbe6f2" stroke-width="14"/>
  <!-- 镜面高光 -->
  <path d="M132 176 A128 128 0 0 1 208 116" stroke="#ffffff" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="星剖 · 星出书页图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0b4440"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f4dfa0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c15c"/>
      <stop offset="1" stop-color="#e08e33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="starC" d="M256 86 L291.3 187.5 L398.7 189.6 L313.1 254.5 L344.2 357.4 L256 296 L167.8 357.4 L198.9 254.5 L113.3 189.6 L220.7 187.5 Z"/>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <!-- 摊开的书页：左页 / 右页双色调，中缝下凹 -->
  <path d="M110 336 C168 306 220 306 256 330 L256 412 C220 388 168 388 110 418 Z" fill="url(#cream)" fill-opacity="0.92"/>
  <path d="M402 336 C344 306 292 306 256 330 L256 412 C292 388 344 388 402 418 Z" fill="#ffffff" fill-opacity="0.72"/>
  <path d="M256 330 L256 412" stroke="#0b4440" stroke-width="7"/>
  <!-- 从书页升起的知识：两粒上浮尘点 + 星 -->
  <circle cx="204" cy="268" r="9" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="304" cy="238" r="7" fill="#ffffff" fill-opacity="0.4"/>
  <use href="#starC" transform="translate(256 192) scale(0.42) translate(-256 -236)" fill="url(#amber)"/>
</svg>

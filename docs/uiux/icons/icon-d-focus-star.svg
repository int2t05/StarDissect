  <use href="#starD" transform="translate(256 234) scale(0.64) translate(-256 -236)" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="16" stroke-linejoin="round"/>
  <use href="#starD" transform="translate(255 230) scale(0.34) translate(-256 -236)" fill="url(#amber)"/>

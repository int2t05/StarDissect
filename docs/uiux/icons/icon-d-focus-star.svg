<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="星剖 · 切片星徽图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0d1422"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c15c"/>
      <stop offset="1" stop-color="#d97c2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
